# Runs on every push and pull request: Lua lint and mocked WoW API regression tests.
# A red cross on a commit means it found a problem.
name: Checks

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Lua and luacheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1 lua-check >/dev/null

      - name: Static checks
        run: luacheck .

      - name: Regression tests
        run: lua5.1 tests/run.lua
